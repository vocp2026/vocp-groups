                            <div><label class="block font-semibold mb-1">4. ความพร้อมในการดูแลตนเองและประเมินความปลอดภัย/การส่งต่อ (1-5)</label><input id="assess-post-q4" type="number" min="1" max="5" value="${postData.q4 || 3}" ${!canEditPost ? 'disabled' : ''} class="w-full px-3 py-2 rounded-xl border border-cream-200"></div>
                            <div><label class="block font-semibold mb-1">หมายเหตุเพิ่มเติม</label><input id="assess-post-note" type="text" value="${escapeHTML(postData.note || '')}" ${!canEditPost ? 'disabled' : ''} class="w-full px-3 py-2 rounded-xl border border-cream-200"></div>
                            <button type="submit" ${!canEditPost ? 'disabled' : ''} class="w-full py-2.5 rounded-xl ${canEditPost ? 'bg-earth-800 hover:bg-earth-700 text-white' : 'bg-gray-200 text-gray-500 cursor-not-allowed'} font-semibold">
                                ${canEditPost ? 'บันทึกประเมินหลังจบการศึกษา' : '🔒 รอผู้ดูแลระบบปลดล็อค'}
                            </button>
                        </form>
                    </div>
                </div>
                `;
            } else if (currentTab === 'replays') {
                tabContent = `
                <div class="space-y-4">
                    ${renderReplayArchiveTab()}
                </div>
                `;
            } else if (currentTab === 'students') {
                const isStudentViewer = role === 'student';
                const canViewFullProfile = true; // บุคลากรเห็นทุกคน / นักศึกษาเห็นเฉพาะข้อมูลของตนเอง
                const q = isStudentViewer ? '' : studentDirectorySearch.trim().toLowerCase();
                const list = (appData.students || []).filter(st => {
                    if (isStudentViewer) return st.id === currentSession.userId;
                    if (studentDirectoryTypeFilter !== 'all' && st.type !== studentDirectoryTypeFilter) return false;
                    if (!q) return true;
                    return (
                        String(st.name || '').toLowerCase().includes(q) ||
                        String(st.code || '').toLowerCase().includes(q) ||
                        String(st.nickname || '').toLowerCase().includes(q) ||
                        String(st.province || '').toLowerCase().includes(q) ||
                        String(st.meditation?.tradition || '').toLowerCase().includes(q) ||
                        String(st.counseling?.details || '').toLowerCase().includes(q)
                    );
                });
                tabContent = `
                <div class="bg-white p-6 rounded-2xl border border-cream-200 space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-cream-200 pb-3">
                        <div>
                            <h2 class="text-lg font-bold text-earth-800">${isStudentViewer ? 'ข้อมูลทะเบียนของฉัน' : `ทะเบียนนักศึกษา ป.จว. รุ่นที่ 1 (${list.length} / ${(appData.students || []).length} คน)`}</h2>
                            <p class="text-xs text-gray-500">${isStudentViewer
                                ? 'แสดงเฉพาะข้อมูลของท่านเอง (นักศึกษาไม่สามารถดูข้อมูลของผู้อื่นได้)'
                                : 'สิทธิ์อาจารย์ / Admin / TA: แสดงประวัติการปฏิบัติวิปัสสนาภาวนาและประสบการณ์ด้านการปรึกษาของนักศึกษาทุกคน'
                            }</p>
                        </div>
                        ${isStudentViewer ? '' : `<div class="flex flex-wrap items-center gap-2">
                            <select onchange="studentDirectoryTypeFilter = this.value; renderApp();" class="px-3 py-2 rounded-xl border border-cream-200 text-xs bg-cream-50">
                                <option value="all" ${studentDirectoryTypeFilter === 'all' ? 'selected' : ''}>ทั้งหมด (${(appData.students || []).length})</option>
                                <option value="พระภิกษุ" ${studentDirectoryTypeFilter === 'พระภิกษุ' ? 'selected' : ''}>พระภิกษุ (${(appData.students || []).filter(x => x.type === 'พระภิกษุ').length})</option>
                                <option value="ฆราวาส" ${studentDirectoryTypeFilter === 'ฆราวาส' ? 'selected' : ''}>ฆราวาส (${(appData.students || []).filter(x => x.type === 'ฆราวาส').length})</option>
                            </select>
                            <input id="student-dir-search" type="text" value="${escapeHTML(studentDirectorySearch)}" oninput="studentDirectorySearch = this.value; renderApp();" placeholder="ค้นหารหัส ชื่อ จังหวัด แนวปฏิบัติ..." class="px-3.5 py-2 rounded-xl border border-cream-200 text-xs w-full sm:w-64">
                        </div>`}
                    </div>
                    <div class="space-y-3 max-h-[65vh] overflow-y-auto pr-1 text-xs">
                        ${list.map(st => `
                            <div class="p-4 rounded-2xl border border-cream-200 bg-cream-50/50 space-y-2.5">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                    <div class="font-bold text-sm text-earth-800">
                                        ${escapeHTML(st.code)} • ${escapeHTML(st.name)} ${st.nickname ? `<span class="text-sage-700">(${escapeHTML(st.nickname)})</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap items-center gap-1.5">
                                        <span class="px-2.5 py-0.5 rounded-full bg-sage-100 text-sage-900 font-bold">${escapeHTML(st.type)}</span>
                                        <span class="px-2.5 py-0.5 rounded-full bg-white border border-cream-200 text-earth-800 font-semibold">${escapeHTML(st.province || '-')}</span>
                                        ${canViewFullProfile ? `<span class="px-2.5 py-0.5 rounded-full bg-teal-50 border border-teal-200 text-teal-900 font-semibold">${escapeHTML(st.education || '-')} • ${escapeHTML(st.profession || '-')}</span>` : ''}
                                    </div>
                                </div>

                                ${canViewFullProfile ? `
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
                                    <div class="p-3 rounded-xl bg-emerald-50/70 border border-emerald-200 space-y-1">
                                        <div class="font-bold text-emerald-950">🧘 ประวัติการปฏิบัติวิปัสสนาภาวนา</div>
                                        <div class="text-gray-800"><b>สถานะการปฏิบัติ:</b> ${escapeHTML(st.meditation?.hasPracticed || '-')}</div>
                                        <div class="text-gray-800"><b>แนวทาง / สำนักปฏิบัติ:</b> ${escapeHTML(st.meditation?.tradition || '-')}</div>
                                        <div class="text-gray-700"><b>ระยะเวลา / คอร์สเก็บอารมณ์:</b> ${escapeHTML(st.meditation?.years || '-')} • ${escapeHTML(st.meditation?.intensiveCourses || '-')}</div>
                                    </div>
                                    <div class="p-3 rounded-xl bg-teal-50/70 border border-teal-200 space-y-1">
                                        <div class="font-bold text-teal-950">💬 ประวัติและประสบการณ์ด้านการปรึกษา</div>
                                        <div class="text-gray-800"><b>พื้นฐานการปรึกษา:</b> ${escapeHTML(st.counseling?.hasExperience || '-')}</div>
                                        <div class="text-gray-800"><b>รายละเอียดประสบการณ์:</b> ${escapeHTML(st.counseling?.details || '-')}</div>
                                        ${st.notes ? `<div class="text-amber-900 font-semibold"><b>หมายเหตุทะเบียน:</b> ${escapeHTML(st.notes)}</div>` : ''}
                                    </div>
                                </div>
                                ` : `
                                <div class="text-gray-600">วุฒิการศึกษา: ${escapeHTML(st.education || '-')} • อาชีพ/บทบาท: ${escapeHTML(st.profession || '-')}</div>
                                `}
                            </div>
                        `).join('')}
                    </div>
                </div>
                ${renderPasswordManagementSection(role)}
                `;
            } else if (currentTab === 'teaching' && canViewTeaching()) {
                tabContent = renderTeachingTab();
            } else if (currentTab === 'homework' && role === 'student') {
                tabContent = renderHomeworkTab();
            } else if (currentTab === 'admin_panel' && role === 'admin') {
                tabContent = `
                <div class="space-y-5">
                    <div class="bg-white p-6 rounded-2xl border-2 border-sage-200 space-y-4 text-xs">
                        <div class="border-b border-cream-200 pb-3">
                            <h2 class="text-lg font-bold text-earth-800">แผงควบคุมผู้ดูแลระบบหลักสูตร (Admin เท่านั้น)</h2>
                            <p class="text-gray-500">สำรองข้อมูลระบบ (.json) และล้างข้อมูลทดลองใช้งานอย่างปลอดภัย (ยืนยัน 2 ชั้น + รหัสผ่าน)</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div class="p-4 rounded-2xl bg-sage-50 border border-sage-200 space-y-2 flex flex-col justify-between">
                                <div>
                                    <div class="font-bold text-sm text-sage-900">1. สำรองข้อมูลทั้งระบบ (.JSON)</div>
                                    <p class="text-gray-700 mt-1">ดาวน์โหลดข้อมูลรายชื่อนักศึกษา การเช็กชื่อ บันทึกการปรึกษา และลิงก์วิดีโอเก็บไว้เป็นไฟล์สำรอง</p>
                                </div>
                                <button type="button" onclick="exportBackupJson()" class="w-full py-2.5 px-4 rounded-xl bg-sage-700 hover:bg-sage-800 text-white font-bold shadow-sm transition">
                                    📥 สำรอง / กู้คืนข้อมูล (.json)
                                </button>
                            </div>

                            <div class="p-4 rounded-2xl bg-red-50/70 border border-red-200 space-y-2 flex flex-col justify-between">
                                <div>
                                    <div class="font-bold text-sm text-red-900">2. ล้างข้อมูลทดลองใช้ / รีเซ็ตระบบ</div>
                                    <p class="text-gray-700 mt-1">มีระบบป้องกันการกดพลาด: ต้องยืนยัน 2 ครั้งและใส่รหัสผ่าน Admin ทุกครั้ง</p>
                                </div>
                                <div class="flex flex-col gap-2">
                                    <button type="button" onclick="openSafeClearDataModal('clear_trial')" class="w-full py-2 px-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold">
                                        🗑️ ล้างข้อมูลที่ทดลองกดเล่น (ยืนยัน 2 ชั้น)
                                    </button>
                                    <button type="button" onclick="openSafeClearDataModal('reset_default')" class="w-full py-2 px-3 rounded-xl bg-white hover:bg-red-100 text-red-800 border border-red-300 font-bold">
                                        ⚠️ รีเซ็ตข้อมูลตั้งต้นทั้งหมด (ยืนยัน 2 ชั้น)
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${renderPasswordManagementSection(role)}
                </div>
                `;
            }

            const replayCount = ensureDefaultReplays(appData).length;
            const isReplayActive = currentTab === 'replays';

            return `
            <div class="min-h-screen flex flex-col">
                <header class="bg-gradient-to-r from-sage-800 via-sage-700 to-earth-800 text-white border-b border-sage-900 sticky top-0 z-20 shadow-md">
                    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
                        <div class="space-y-1 min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-base sm:text-lg font-bold tracking-tight text-white break-words">${escapeHTML(cInfo.name || 'ประกาศนียบัตรการปรึกษาเชิงจิตวิทยาแนววิปัสสนาภาวนา (ป.จว. รุ่น 1 )')}</span>
                                <span class="px-3 py-0.5 rounded-full text-xs font-bold shadow-sm ${activeRoleBadge.cls}">${escapeHTML(activeRoleBadge.label)}</span>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 text-xs text-sage-100">
                                <span class="px-2.5 py-0.5 rounded-lg bg-white/15 text-white font-bold">ผู้ใช้งาน: ${escapeHTML(currentSession.displayName)}</span>
                                <span>(${escapeHTML(currentSession.subtitle)})</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 shrink-0">
                            <button type="button" onclick="currentTab = 'replays'; renderApp();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition shadow-sm ${isReplayActive ? 'bg-cyan-300 text-cyan-950 ring-2 ring-white' : 'bg-cyan-600 hover:bg-cyan-500 text-white border border-cyan-300/60'}">
                                🎬 คลิปย้อนหลัง (${replayCount})
                            </button>
                            <button type="button" onclick="openChangePasswordModal()" class="px-3.5 py-2 rounded-xl bg-sage-100 hover:bg-white text-xs font-bold text-earth-800 transition shadow-sm">
                                เปลี่ยนรหัสผ่าน
                            </button>
                            <button type="button" onclick="handleLogout()" class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold text-white border border-white/25 transition">
                                ออกจากระบบ
                            </button>
                        </div>
                    </div>
                    <nav class="bg-white/95 backdrop-blur border-t border-cream-200">
                        <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center gap-2 overflow-x-auto text-xs font-bold">
                            ${navItems.map(item => `
                                <button type="button" onclick="goTab('${item.id}')" class="px-4 py-2 rounded-xl whitespace-nowrap transition ${currentTab === item.id ? item.activeCls : item.idleCls}">
                                    ${item.label}
                                </button>
                            `).join('')}
                        </div>
                    </nav>
                </header>
                <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
                    ${tabContent}
                </main>
            </div>
            `;
        }

        // =========================================================================
        // 8. เก็บบันทึกการปฏิบัติธรรม (30 วัน / ในชั้นเรียน / โปรแกรม 28 วัน) แยกรายผู้ใช้
        // =========================================================================
        let practiceLoadedFor = null;
        function emptyReflections() {
            const z = () => ({ body: 0, feeling: 0, mind: 0, returnAware: 0, nonHarm: 0 });
            return { pre: z(), day14: z(), day28: z() };
        }
        function syncPracticeForCurrentUser() {
            const uid = currentSession?.userId || null;
            if (uid === practiceLoadedFor) return;
            practiceLoadedFor = uid;
            if (!uid) return;
            if (!appData.practiceByUser || typeof appData.practiceByUser !== 'object') appData.practiceByUser = {};
            const store = appData.practiceByUser[uid];
            if (store) {
                daily30PracticeEntries = Array.isArray(store.daily30) ? store.daily30 : [];
                classPracticeEntries = Array.isArray(store.classPractice) ? store.classPractice : [];
                program28JournalNotes = store.journal || {};
                program28Reflections = store.reflections || emptyReflections();
            } else if (currentSession.role !== 'student') {
                // ตัวอย่างสาธิตเดิมแสดงให้บุคลากร; นักศึกษาเริ่มต้นด้วยบันทึกว่าง
                persistPractice();
            } else {
                daily30PracticeEntries = [];
                classPracticeEntries = [];
                program28JournalNotes = {};
                program28Reflections = emptyReflections();
                persistPractice();
            }
        }
        function persistPractice() {
            const uid = currentSession?.userId;
            if (!uid) return;
            if (!appData.practiceByUser || typeof appData.practiceByUser !== 'object') appData.practiceByUser = {};
            appData.practiceByUser[uid] = {
                daily30: daily30PracticeEntries,
                classPractice: classPracticeEntries,
                journal: program28JournalNotes,
                reflections: program28Reflections
            };
            saveAppData(appData);
        }

        // =========================================================================
        // 9. ฟังก์ชันหลักในการเรนเดอร์หน้าจอทั้งหมด
        // =========================================================================
        function renderApp() {
            const root = document.getElementById('app');
            if (!root) return;
            try {
                if (!appData || typeof appData !== 'object') {
                    appData = loadAppData();
                }
                // รายชื่อ ตารางเรียน และบัญชีผู้ใช้ทั้งหมดโหลดจาก Google Sheet (applyServerData)
                if (!Array.isArray(appData.sessions)) appData.sessions = [];
                appData.students = (appData.students || []).map(s => enrichStudentProfile(s));
                ensureStaffAccounts(appData);
                ensureDefaultReplays(appData);
                syncPracticeForCurrentUser();
                const badge = document.getElementById('sync-badge');
                if (!badge) setSyncBadge('saved');
                else badge.style.display = currentSession ? '' : 'none';
                const active = document.activeElement;
                const focusId = active && active.id && root.contains(active) ? active.id : '';
                let selStart = null, selEnd = null;
                try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch (_) {}
                root.innerHTML = currentSession ? renderWorkspace() : renderLoginScreen();
                if (focusId) {
                    const el = document.getElementById(focusId);
                    if (el) {
                        el.focus();
                        try { if (selStart !== null) el.setSelectionRange(selStart, selEnd); } catch (_) {}
                    }
                }
            } catch (err) {
                console.error('Render error:', err);
                root.innerHTML = `
                    <div class="max-w-lg mx-auto my-12 bg-white p-6 rounded-2xl border border-red-200 text-center space-y-3 relative z-30">
                        <div class="text-red-700 font-bold text-sm">เกิดข้อผิดพลาดในการแสดงผลหน้าจอ</div>
                        <button type="button" onclick="window.recoverAndReloadApp()" class="px-5 py-2.5 rounded-xl bg-sage-600 hover:bg-sage-700 text-white text-xs font-semibold cursor-pointer">
                            ซ่อมแซมและโหลดหน้าจอใหม่
                        </button>
                    </div>
                `;
            }
        }

        window.recoverAndReloadApp = function() {
            // โหลดข้อมูลใหม่จาก Google Sheet (ข้อมูลไม่ได้เก็บในเครื่อง จึงไม่มีอะไรต้องซ่อม)
            currentTab = 'overview';
            location.reload();
        };

        window.toggleLoginPinVisibility = function() {
            const input = document.getElementById('login-pin');
            const btn = document.getElementById('login-pin-eye');
            const icon = document.getElementById('login-pin-eye-icon');
            if (!input || !btn || !icon) return;
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            const label = show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน';
            btn.setAttribute('aria-label', label);
            btn.title = label;
            icon.innerHTML = show
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/>'
                : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
            input.focus();
        };

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', () => {
                bootApp();
            });
        } else {
            bootApp();
        }
    </script>
</body>
</html>
