            const matchedSeed = ANNOUNCED_STUDENTS.find(x => x.code === st.code || x.id === st.id);
            const fallbackMeditation = matchedSeed?.meditation || {
                hasPracticed: (st.retreatDays || 0) > 0 ? 'เคยปฏิบัติวิปัสสนาภาวนา' : 'สนใจและฝึกปฏิบัติธรรม',
                years: (st.retreatDays || 0) > 0 ? `${st.retreatDays} วัน/ปีสะสม` : '-',
                intensiveCourses: (st.retreatDays || 0) > 0 ? `เคยเข้าคอร์สปฏิบัติ (สะสม ${st.retreatDays} วัน)` : '-',
                tradition: 'วิปัสสนาภาวนา / สติปัฏฐาน'
            };
            const fallbackCounseling = matchedSeed?.counseling || {
                hasExperience: 'มีประสบการณ์การรับฟังและให้คำแนะนำตามบทบาท',
                details: st.profession ? `ประยุกต์การรับฟังและให้คำปรึกษาในบริบท${st.profession}` : 'รับฟังและให้คำแนะนำผู้คนรอบข้าง'
            };

            return {
                ...st,
                meditation: {
                    hasPracticed: st.meditation?.hasPracticed || fallbackMeditation.hasPracticed,
                    years: st.meditation?.years || fallbackMeditation.years,
                    intensiveCourses: st.meditation?.intensiveCourses || fallbackMeditation.intensiveCourses,
                    tradition: st.meditation?.tradition || fallbackMeditation.tradition
                },
                counseling: {
                    hasExperience: st.counseling?.hasExperience || fallbackCounseling.hasExperience,
                    details: st.counseling?.details || fallbackCounseling.details
                }
            };
        }

        // แปลงตัวเลขไทย ๐-๙ เป็นเลขอารบิค 0-9 อัตโนมัติทั่วทั้งระบบ
        function toArabicDigits(val) {
            const thaiNums = ['๐', '๑', '๒', '๓', '๔', '๕', '๖', '๗', '๘', '๙'];
            return String(val ?? '').replace(/[๐-๙]/g, ch => String(thaiNums.indexOf(ch)));
        }

        function escapeHTML(str) {
            return toArabicDigits(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getTodayISO() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function toDateISO(yearCE, month1to12, day1to31) {
            return `${yearCE}-${String(month1to12).padStart(2, '0')}-${String(day1to31).padStart(2, '0')}`;
        }

        function formatThaiDate(isoStr) {
            if (!isoStr || !String(isoStr).includes('-')) return isoStr || '-';
            const parts = String(isoStr).split('-');
            if (parts.length !== 3) return isoStr;
            const yBE = Number(parts[0]) + 543;
            const mIdx = Number(parts[1]) - 1;
            const d = Number(parts[2]);
            const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            return `${d} ${months[mIdx] || parts[1]} ${yBE}`;
        }

        const TERM_CALENDAR_MONTHS = [
            { yearCE: 2026, month: 11, label: 'พฤศจิกายน 2569' },
            { yearCE: 2026, month: 12, label: 'ธันวาคม 2569' },
            { yearCE: 2027, month: 1, label: 'มกราคม 2570' },
            { yearCE: 2027, month: 2, label: 'กุมภาพันธ์ 2570' }
        ];

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const colorMap = {
                success: 'bg-sage-700 text-white border-sage-800',
                error: 'bg-red-700 text-white border-red-800',
                info: 'bg-earth-800 text-white border-earth-700'
            };
            toast.className = `px-4 py-3 rounded-2xl shadow-lg border text-xs font-semibold transition-all duration-300 ${colorMap[type] || colorMap.success}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            if (backdrop) {
                backdrop.classList.add('hidden');
                backdrop.classList.remove('flex');
            }
        }

        // =========================================================================
        // 2.1 เชื่อมต่อ Google Sheet ผ่าน Google Apps Script
        //     ข้อมูลทั้งหมดเก็บใน Sheet — หน้าเว็บส่งเฉพาะรายการที่เปลี่ยน และเซิร์ฟเวอร์ตรวจสิทธิ์ทุกรายการ
        // =========================================================================
        const SERVER_URL = (window.APP_CONFIG && window.APP_CONFIG.GAS_URL) || '';
        const TOKEN_KEY = SESSION_AUTH_KEY + '_token';
        let serverToken = '';
        try { serverToken = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (_) {}
        let syncSnapshot = null;      // สำเนาข้อมูลล่าสุดที่ตรงกับเซิร์ฟเวอร์ {collection: {key: json}}
        let syncInFlight = false;
        let syncAgain = false;
        let syncRetryTimer = null;
        let lastServerJson = '';

        async function lmsCall(action, params = {}) {
            if (!SERVER_URL) throw new Error('ยังไม่ได้ตั้งค่า Web App URL ในไฟล์ config.js');
            const body = Object.assign({}, params, { action });
            if (serverToken && action !== 'lmsLogin' && action !== 'lmsPublic') body.token = serverToken;
            let res, d;
            try {
                // text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
                res = await fetch(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
            } catch (e) {
                throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต');
            }
            try { d = await res.json(); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง'); }
            if (!d.ok) {
                const err = new Error(d.error || 'เกิดข้อผิดพลาด');
                err.auth = !!d.auth;
                throw err;
            }
            return d;
        }

        const SYNC_ARRAYS = ['students', 'teacherAccounts', 'taAccounts', 'sessions', 'replays', 'logs', 'assignments'];
        const SYNC_OBJECTS = ['attendance', 'selfAssessments', 'practiceByUser', 'courseReflections', 'submissions', 'reviews'];

        function syncCollections(data) {
            const out = {};
            SYNC_ARRAYS.forEach(c => {
                out[c] = {};
                (data[c] || []).forEach(x => { if (x && x.id != null) out[c][String(x.id)] = JSON.stringify(x); });
            });
            SYNC_OBJECTS.forEach(c => {
                out[c] = {};
                const o = data[c] || {};
                Object.keys(o).forEach(k => { out[c][k] = JSON.stringify(o[k]); });
            });
            out.settings = {
                courseInfo: JSON.stringify(data.courseInfo || {}),
                postAssessmentLocked: JSON.stringify({ value: !!data.postAssessmentLocked })
            };
            return out;
        }

        function syncDiff(prev, next) {
            const changes = {};
            let n = 0;
            Object.keys(next).forEach(c => {
                const a = (prev && prev[c]) || {}, b = next[c];
                Object.keys(b).forEach(k => { if (a[k] !== b[k]) { (changes[c] = changes[c] || {})[k] = JSON.parse(b[k]); n++; } });
                Object.keys(a).forEach(k => { if (!(k in b)) { (changes[c] = changes[c] || {})[k] = null; n++; } });
            });
            return n ? changes : null;
        }

        function applyServerData(resp) {
            const data = (resp && resp.data) || {};
            lastServerJson = JSON.stringify(data);
            data.students = (data.students || []).map(s => enrichStudentProfile(s));
            appData = Object.assign(getDefaultAppData(), data);
            ensureDefaultReplays(appData);
            syncSnapshot = syncCollections(appData);
            practiceLoadedFor = null;
        }

        function setSyncBadge(state, text) {
            let el = document.getElementById('sync-badge');
            if (!el) {
                el = document.createElement('div');
                el.id = 'sync-badge';
                el.className = 'fixed bottom-4 left-4 z-50 px-3 py-1.5 rounded-full text-xs font-bold shadow border transition';
                document.body.appendChild(el);
            }
            const map = {
                saving: ['☁️ กำลังบันทึกลง Google Sheet…', 'bg-amber-50 text-amber-900 border-amber-200'],
                saved: ['✓ บันทึกลง Google Sheet แล้ว', 'bg-sage-50 text-sage-800 border-sage-200'],
                error: ['⚠️ ยังบันทึกไม่สำเร็จ — กำลังลองใหม่', 'bg-red-50 text-red-800 border-red-200']
            };
            const [label, cls] = map[state] || map.saved;
            el.textContent = text || label;
            el.className = 'fixed bottom-4 left-4 z-50 px-3 py-1.5 rounded-full text-xs font-bold shadow border transition ' + cls;
            el.style.display = currentSession ? '' : 'none';
        }

        function loadAppData() {
            return appData || getDefaultAppData();
        }

        // ทุกครั้งที่แอปบันทึก: ส่งเฉพาะรายการที่เปลี่ยนไป Google Sheet
        function saveAppData(data) {
            if (!currentSession || !serverToken || !syncSnapshot) return;
            if (syncInFlight) { syncAgain = true; return; }
            pushChangesToServer();
        }

        async function pushChangesToServer() {
            const next = syncCollections(appData);
            const changes = syncDiff(syncSnapshot, next);
            if (!changes) return;
            syncInFlight = true;
            setSyncBadge('saving');
            try {
                const r = await lmsCall('lmsSave', { changes });
                Object.keys(changes).forEach(c => {
                    syncSnapshot[c] = syncSnapshot[c] || {};
                    Object.keys(changes[c]).forEach(k => {
                        if (changes[c][k] === null) delete syncSnapshot[c][k];
                        else syncSnapshot[c][k] = next[c][k];
                    });
                });
                if (r.skipped && r.skipped.length) console.info('รายการที่ไม่มีสิทธิ์บันทึก (ข้าม):', r.skipped);
                setSyncBadge('saved');
            } catch (e) {
                if (e.auth) {
                    handleAuthExpired(e.message);
                } else {
                    setSyncBadge('error');
                    showToast('บันทึกลง Google Sheet ไม่สำเร็จ: ' + e.message, 'error');
                    clearTimeout(syncRetryTimer);
                    syncRetryTimer = setTimeout(() => saveAppData(appData), 8000);
                }
            } finally {
                syncInFlight = false;
                if (syncAgain) { syncAgain = false; saveAppData(appData); }
            }
        }

        // ดึงข้อมูลล่าสุดจาก Sheet เป็นระยะ (เมื่อไม่ได้พิมพ์อยู่และไม่มีรายการค้างส่ง)
        async function refreshFromServer(force) {
            if (!currentSession || !serverToken || syncInFlight) return;
            if (!force) {
                if (document.hidden) return;
                const a = document.activeElement;
                if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
                const bd = document.getElementById('modal-backdrop');
                if (bd && !bd.classList.contains('hidden')) return;
            }
            if (syncDiff(syncSnapshot, syncCollections(appData))) return;
            try {
                const d = await lmsCall('lmsLoad');
                if (JSON.stringify(d.data) !== lastServerJson) {
                    applyServerData(d);
                    renderApp();
                }
            } catch (e) {
                if (e.auth) handleAuthExpired(e.message);
            }
        }
        setInterval(() => refreshFromServer(false), 90000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshFromServer(false); });

        async function loadPublicInfo() {
            appData = getDefaultAppData();
            syncSnapshot = null;
            try {
                const p = await lmsCall('lmsPublic');
                appData.courseInfo = Object.assign({}, appData.courseInfo, p.courseInfo || {});
                appData.teacherAccounts = p.teacherAccounts || [];
                appData.taAccounts = p.taAccounts || [];
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        function handleAuthExpired(msg) {
            currentSession = null;
            saveSession(null);
            showToast(msg || 'หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่', 'error');
            loadPublicInfo().then(renderApp);
        }

        async function bootApp() {
            appData = getDefaultAppData();
            renderApp();
            if (serverToken) {
                try {
                    const d = await lmsCall('lmsLoad');
                    currentSession = d.session;
                    saveSession(currentSession);
                    applyServerData(d);
                    renderApp();
                    return;
                } catch (e) {
                    currentSession = null;
                    saveSession(null);
                }
            }
            await loadPublicInfo();
            renderApp();
        }

        function loadSession() {
            try {
                const raw = sessionStorage.getItem(SESSION_AUTH_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (_) {
                return null;
            }
        }

        function saveSession(sess) {
            try {
                if (sess) {
                    sessionStorage.setItem(SESSION_AUTH_KEY, JSON.stringify(sess));
                    if (serverToken) sessionStorage.setItem(TOKEN_KEY, serverToken);
                } else {
                    serverToken = '';
                    sessionStorage.removeItem(SESSION_AUTH_KEY);
                    sessionStorage.removeItem(TOKEN_KEY);
                }
            } catch (_) {}
        }

        function getCourseThemeStyle(text) {
            const t = toArabicDigits(String(text || ''));
            if (t.includes('จว 001')) {
                return { cardClass: 'bg-teal-50/70 border-teal-200 text-teal-950', pillClass: 'bg-teal-100 text-teal-900 border-teal-300' };
            }
            if (t.includes('จว 002')) {
                return { cardClass: 'bg-emerald-50/70 border-emerald-200 text-emerald-950', pillClass: 'bg-emerald-100 text-emerald-900 border-emerald-300' };
            }
            if (t.includes('จว 003')) {
                return { cardClass: 'bg-cyan-50/70 border-cyan-200 text-cyan-950', pillClass: 'bg-cyan-100 text-cyan-900 border-cyan-300' };
            }
            if (t.includes('จว 004')) {
                return { cardClass: 'bg-sage-50/80 border-sage-200 text-sage-950', pillClass: 'bg-sage-100 text-sage-900 border-sage-300' };
            }
            if (t.includes('ปฏิบัติธรรม')) {
                return { cardClass: 'bg-amber-50/70 border-amber-200 text-amber-950', pillClass: 'bg-amber-100 text-amber-900 border-amber-300' };
            }
            return { cardClass: 'bg-cream-50/80 border-cream-200 text-earth-800', pillClass: 'bg-sage-100 text-sage-800 border-sage-200' };
        }

        function evaluateAttendanceStatus(checkInTime, checkOutTime) {
            if (!checkInTime && !checkOutTime) {
                return { label: 'ยังไม่เช็กชื่อ', badgeClass: 'bg-gray-100 text-gray-600' };
            }
            if (checkInTime && !checkOutTime) {
                return { label: 'เช็กชื่อเข้าเรียนแล้ว', badgeClass: 'bg-amber-100 text-amber-800' };
            }
            return { label: 'เข้า-ออกครบถ้วน', badgeClass: 'bg-emerald-100 text-emerald-800' };
        }

        window.normalizeReplayUrl = function(url) {
            const u = String(url || '').trim();
            if (!u) return '';
            if (/^https?:\/\//i.test(u)) return u;
            if (u.startsWith('www.') || u.includes('youtube.com') || u.includes('youtu.be')) return `https://${u}`;
            return '';
        };

        function ensureDefaultReplays(data) {
            if (!Array.isArray(data.replays) || data.replays.length === 0) {
                data.replays = (data.sessions || SCHEDULE_SESSIONS).map(s => ({
                    id: `REP-${s.id}`,
                    sessionId: s.id,
                    date: s.date,
                    title: s.title,
                    instructor: s.instructor,
                    url: '',
                    notes: ''
                }));
            }
            return data.replays;
        }

        window.handleReplayFileUpload = function(event, replayId) {
            const file = event.target?.files?.[0];
            if (!file) return;
            const item = (appData.replays || []).find(r => r.id === replayId);
            if (!item) return;

            const objectUrl = URL.createObjectURL(file);
            const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
            item.url = objectUrl;
            item.uploadedFileName = file.name;
            item.uploadedFileSize = `${sizeMB} MB`;
            item.uploadedBy = currentSession?.displayName || 'เจ้าหน้าที่';
            if (!item.notes) {
                item.notes = `อัปโหลดไฟล์วิดีโอ: ${file.name} (${sizeMB} MB)`;
            }
            saveAppData(appData);
            showToast(`อัปโหลดคลิป "${file.name}" เรียบร้อยแล้ว`);
            renderApp();
        };

        window.exportBackupJson = function() {
            const backdrop = document.getElementById('modal-backdrop');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            if (!backdrop || !titleEl || !bodyEl) return;
            const payload = {
                exportedAt: new Date().toISOString(),
                course: appData.courseInfo?.name || 'ป.จว. รุ่นที่ 1',
                data: appData
            };
            titleEl.textContent = 'สำรอง / กู้คืนข้อมูล (.json)';
            bodyEl.innerHTML = `
                <div class="space-y-3 text-xs">
                    <p class="text-gray-700">กด <b>คัดลอก</b> แล้ววางเก็บในไฟล์ข้อความ (เช่น backup_vipassana_lms_${getTodayISO()}.json) — หากต้องการกู้คืน ให้วางข้อมูลสำรองลงในกล่องนี้แล้วกด <b>กู้คืนจากข้อมูลที่วาง</b></p>
                    <textarea id="backup-json-box" rows="12" class="w-full px-3 py-2 rounded-xl border border-cream-200 bg-cream-50/40 font-mono text-[12px]"></textarea>
                    <div class="flex flex-wrap justify-end gap-2">
                        <button type="button" onclick="copyBackupJson()" class="px-4 py-2.5 rounded-xl bg-sage-600 hover:bg-sage-700 text-white font-bold">คัดลอกข้อมูลสำรอง</button>
                        ${currentSession?.role === 'admin' ? `<button type="button" onclick="restoreBackupJson()" class="px-4 py-2.5 rounded-xl bg-earth-800 hover:bg-earth-700 text-white font-bold">กู้คืนจากข้อมูลที่วาง</button>` : ''}
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-cream-100 hover:bg-cream-200 text-earth-800 font-semibold">ปิด</button>
                    </div>
                </div>`;
            document.getElementById('backup-json-box').value = JSON.stringify(payload, null, 2);
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
        };

        window.copyBackupJson = function() {
            const box = document.getElementById('backup-json-box');
            if (!box) return;
            const done = () => showToast('คัดลอกข้อมูลสำรองแล้ว นำไปวางเก็บในไฟล์ได้ทันที');
            try {
                navigator.clipboard.writeText(box.value).then(done).catch(() => {
                    box.select(); document.execCommand('copy'); done();
                });
            } catch (_) {
                box.select();
                try { document.execCommand('copy'); done(); } catch (e) { showToast('คัดลอกไม่สำเร็จ กรุณาเลือกข้อความแล้วคัดลอกเอง', 'error'); }
            }
        };

        window.restoreBackupJson = function() {
            if (currentSession?.role !== 'admin') return;
            try {
                const parsed = JSON.parse(document.getElementById('backup-json-box')?.value || '');
                const data = parsed && parsed.data ? parsed.data : parsed;
                if (!data || !Array.isArray(data.students) || !Array.isArray(data.sessions)) throw new Error('bad');
                appData = data;
                practiceLoadedFor = null;
                saveAppData(appData);
                closeModal();
                showToast('กู้คืนข้อมูลจากไฟล์สำรองเรียบร้อยแล้ว');
                renderApp();
            } catch (_) {
                showToast('ข้อมูลสำรองไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง', 'error');
            }
        };

        window.openSafeClearDataModal = function(actionType) {
            if (currentSession?.role !== 'admin') return;
            const backdrop = document.getElementById('modal-backdrop');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            if (!backdrop || !titleEl || !bodyEl) return;

            const isFullReset = actionType === 'reset_default';
            titleEl.textContent = isFullReset
                ? '⚠️ ยืนยันการรีเซ็ตข้อมูลตั้งต้นทั้งหมด (ขั้นตอนที่ 1/2)'
                : '⚠️ ยืนยันการล้างข้อมูลที่ทดลองกดเล่น (ขั้นตอนที่ 1/2)';

            bodyEl.innerHTML = `
                <div class="space-y-4 text-xs">
                    <div class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-900 space-y-1.5">
                        <div class="font-bold text-sm">คำเตือนสำคัญ: การดำเนินการนี้ไม่สามารถย้อนกลับได้</div>
                        <p>${isFullReset
                            ? 'ระบบจะลบข้อมูลที่บันทึกไว้ทั้งหมด (เช็กชื่อ, แบบบันทึกการปรึกษา, แบบประเมิน, ลิงก์วิดีโอ และการตั้งค่ารหัสผ่าน) เพื่อกลับสู่ค่าเริ่มต้นตามประกาศ'
                            : 'ระบบจะลบข้อมูลการเช็กชื่อเข้า-ออกเรียน, แบบบันทึกการให้การปรึกษา, แบบประเมินตนเอง และบันทึกการฝึกปฏิบัติธรรมที่ทดลองบันทึกไว้ทั้งหมด'
                        }</p>
                        <p class="font-semibold">แนะนำให้กด "สำรองข้อมูลก่อน" แล้วคัดลอกเก็บไว้ก่อนดำเนินการ</p>
                    </div>
                    <div class="flex flex-wrap items-center justify-end gap-2 pt-2">
                        <button type="button" onclick="exportBackupJson()" class="px-4 py-2.5 rounded-xl bg-sage-100 hover:bg-sage-200 text-sage-900 font-bold">
                            📥 สำรองข้อมูลก่อน
                        </button>
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-cream-100 hover:bg-cream-200 text-earth-800 font-semibold">
                            ยกเลิก
                        </button>
                        <button type="button" onclick="openSafeClearDataStep2('${actionType}')" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold">
                            ยืนยันครั้งที่ 1 → ไปขั้นใส่รหัสผ่าน
                        </button>
                    </div>
                </div>
            `;
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
        };

        window.openSafeClearDataStep2 = function(actionType) {
            if (currentSession?.role !== 'admin') return;
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            if (!titleEl || !bodyEl) return;

            const isFullReset = actionType === 'reset_default';
            titleEl.textContent = isFullReset

        window.executeVerifiedClearData = function(event, actionType) {
            event.preventDefault();
            if (currentSession?.role !== 'admin') return;
            const confirmWord = (document.getElementById('clear-confirm-word')?.value || '').trim();
            const passVal = (document.getElementById('clear-admin-password')?.value || '').trim();
            if (confirmWord !== 'ยืนยัน') {
                showToast('กรุณาพิมพ์คำว่า "ยืนยัน" ให้ถูกต้อง', 'error');
                return;
            }

            // ตรวจรหัสผ่านและล้างข้อมูลที่เซิร์ฟเวอร์ (สำรองแท็บเดิมไว้ใน Sheet ก่อนล้างทุกครั้ง)
            const isFullReset = actionType === 'reset_default';
            showToast('กำลังดำเนินการ…', 'info');
            lmsCall(isFullReset ? 'lmsReset' : 'lmsClearTrial', { adminPassword: passVal })
                .then(d => {
                    applyServerData(d);
                    closeModal();
                    showToast(isFullReset ? 'รีเซ็ตข้อมูลตั้งต้นตามประกาศเรียบร้อยแล้ว' : 'ล้างข้อมูลการทดลองใช้งานเรียบร้อยแล้ว', isFullReset ? 'success' : 'info');
                    renderApp();
                })
                .catch(e => showToast(e.message, 'error'));
        };

        // =========================================================================
        // 3. ฟังก์ชันจัดการการเข้าสู่ระบบและเหตุการณ์ในหน้าต่างทำงาน
        // =========================================================================
        // บัญชีผู้ใช้มาจาก Google Sheet — ตรวจเพียงให้เป็น array
        function ensureStaffAccounts(data) {
            if (!Array.isArray(data.teacherAccounts)) data.teacherAccounts = [];
            if (!Array.isArray(data.taAccounts)) data.taAccounts = [];
        }

        // ตรวจรหัสที่เซิร์ฟเวอร์ (Google Apps Script) — หน้าเว็บไม่มีรายชื่อหรือรหัสผ่านเก็บไว้
        window.handleLoginSubmit = async function(event) {
            event.preventDefault();
            const codeVal = (document.getElementById('login-code')?.value || '').trim();
            const pinVal = (document.getElementById('login-pin')?.value || '').trim();
            const isStaffSelect = loginRoleTab === 'teacher' || loginRoleTab === 'ta';
            const code = isStaffSelect ? (document.getElementById('login-staff-select')?.value || codeVal) : codeVal;
            if (!code || !pinVal) {
                showToast('กรุณากรอกรหัสประจำตัวและรหัสผ่าน', 'error');
                return;
            }
            const btn = event.target.querySelector('button[type="submit"]');
            if (btn) { btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…'; }
            try {
                const d = await lmsCall('lmsLogin', { role: loginRoleTab, code, pin: pinVal });
                serverToken = d.token;
                currentSession = d.session;
                saveSession(currentSession);
                applyServerData(d);
                currentTab = 'overview';
                showToast(`ยินดีต้อนรับ ${currentSession.displayName}`);
                renderApp();
                if (d.mustChangePin) {
                    setTimeout(() => {
                        openChangePasswordModal();
                        showToast('กรุณาเปลี่ยนรหัสผ่านจากค่าเริ่มต้น 1234 เพื่อความปลอดภัย', 'info');
                    }, 300);
                }
            } catch (e) {
                showToast(e.message, 'error');
                if (btn) { btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; }
            }
        };

        window.handleSelfChangePassword = function(event) {
            event.preventDefault();
            if (!currentSession) return;
            ensureStaffAccounts(appData);
            const oldPass = (document.getElementById('cp-old-pass')?.value || '').trim();
            const newPass = (document.getElementById('cp-new-pass')?.value || '').trim();
            const confirmPass = (document.getElementById('cp-confirm-pass')?.value || '').trim();

            if (newPass.length < 4) {
                showToast('รหัสผ่านใหม่ควรมีความยาวอย่างน้อย 4 ตัวอักษร', 'error');
                return;
            }
            if (newPass !== confirmPass) {
                showToast('รหัสผ่านใหม่และยืนยันรหัสผ่านไม่ตรงกัน', 'error');
                return;
            }

            // ตรวจรหัสเดิมและบันทึกรหัสใหม่ที่เซิร์ฟเวอร์
            lmsCall('lmsChangePassword', { oldPassword: oldPass, newPassword: newPass })
                .then(d => {
                    applyServerData(d);
                    closeModal();
                    showToast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');
                    renderApp();
                })
                .catch(e => showToast(e.message, 'error'));
        };

        window.addStaffAccountEntry = function(event, staffType) {
            event.preventDefault();
            ensureStaffAccounts(appData);
            const nameVal = (document.getElementById(`new-${staffType}-name`)?.value || '').trim();
            const userVal = (document.getElementById(`new-${staffType}-user`)?.value || '').trim();
            const passVal = (document.getElementById(`new-${staffType}-pass`)?.value || '').trim() || Math.random().toString(36).slice(2, 8);
            if (!nameVal || !userVal) {
                showToast('กรุณากรอกชื่อ-ตำแหน่ง และชื่อผู้ใช้ให้ครบถ้วน', 'error');
                return;
            }
            const list = staffType === 'teacher' ? appData.teacherAccounts : appData.taAccounts;
            if (list.some(x => String(x.username).toLowerCase() === userVal.toLowerCase())) {
                showToast('ชื่อผู้ใช้นี้มีอยู่ในระบบแล้ว', 'error');
                return;
            }
            list.push({
                id: `${staffType.toUpperCase()}-${Date.now()}`,
                username: userVal,
                password: passVal,
                displayName: nameVal
            });
            saveAppData(appData);
            showToast(`เพิ่มบัญชี${staffType === 'teacher' ? 'อาจารย์ผู้สอน' : 'ผู้ช่วยสอน (TA)'} เรียบร้อยแล้ว`);
            renderApp();
        };

        window.resetStaffOrStudentPassword = function(accountType, targetId, newPass) {
            ensureStaffAccounts(appData);
            const cleanPass = String(newPass || '').trim();
            if (!cleanPass) {
                showToast('กรุณาระบุรหัสผ่านใหม่', 'error');
                return;
            }
            if (accountType === 'teacher') {
                const item = appData.teacherAccounts.find(x => x.id === targetId);
                if (item) item.password = cleanPass;
            } else if (accountType === 'ta') {
                const item = appData.taAccounts.find(x => x.id === targetId);
                if (item) item.password = cleanPass;
            } else if (accountType === 'student') {
                const st = appData.students.find(x => x.id === targetId);
                if (st) st.pin = cleanPass;
            }
            saveAppData(appData);
            showToast('อัปเดตรหัสผ่านเรียบร้อยแล้ว');
            renderApp();
        };

                : (document.getElementById('log-target-student')?.value || appData.students[0]?.id);

        function renderTermCalendarWidget() {
            const mObj = TERM_CALENDAR_MONTHS[calendarMonthIndex] || TERM_CALENDAR_MONTHS[0];
            const firstDay = new Date(mObj.yearCE, mObj.month - 1, 1).getDay();
            const daysInMonth = new Date(mObj.yearCE, mObj.month, 0).getDate();
            const dayHeaders = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
            const cells = [];

            for (let i = 0; i < firstDay; i++) {
                cells.push(`<div class="h-14 rounded-xl bg-cream-50/50 border border-cream-200/60"></div>`);
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const iso = toDateISO(mObj.yearCE, mObj.month, d);
                const daySessions = (appData.sessions || []).filter(s => s.date === iso);
                const hasClass = daySessions.length > 0;
                cells.push(`
                    <div class="h-14 p-1.5 rounded-xl border text-left flex flex-col justify-between ${hasClass ? 'bg-sage-50 border-sage-300 text-sage-900' : 'bg-white border-cream-200 text-earth-800'}">
                        <span class="font-bold text-xs">${d}</span>
                        <span class="text-[10px] truncate font-semibold">${hasClass ? escapeHTML(daySessions[0].title.split(' ')[0] + ' ' + (daySessions[0].title.split(' ')[1] || '')) : ''}</span>
                    </div>
                `);
            }

            return `
            <div class="bg-white p-5 rounded-2xl border border-cream-200 space-y-3 text-xs">
                <div class="flex items-center justify-between gap-2">
                    <div class="font-bold text-sm text-earth-800">ปฏิทินตารางเรียนตลอดภาคเรียนที่ 1/2569</div>
                    <div class="flex items-center gap-1.5">
                        <button type="button" onclick="calendarMonthIndex = (calendarMonthIndex - 1 + ${TERM_CALENDAR_MONTHS.length}) % ${TERM_CALENDAR_MONTHS.length}; renderApp();" class="px-2.5 py-1 rounded-lg bg-cream-100 hover:bg-cream-200 font-bold">◀</button>
                        <span class="px-3 py-1 rounded-lg bg-sage-700 text-white font-bold">${escapeHTML(mObj.label)}</span>
                        <button type="button" onclick="calendarMonthIndex = (calendarMonthIndex + 1) % ${TERM_CALENDAR_MONTHS.length}; renderApp();" class="px-2.5 py-1 rounded-lg bg-cream-100 hover:bg-cream-200 font-bold">▶</button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center font-bold text-gray-600">${dayHeaders.map(h => `<div>${h}</div>`).join('')}</div>
                <div class="grid grid-cols-7 gap-1">${cells.join('')}</div>
            </div>
            `;
        }

        // คำนวณจำนวนนาทีจากเวลาเริ่ม (HH:MM) ถึงเวลาสิ้นสุด (HH:MM)
        function calculateMinutesBetween(startStr, endStr) {
            if (!startStr || !endStr) return 0;
            const [sh, sm] = String(startStr).split(':').map(Number);
            const [eh, em] = String(endStr).split(':').map(Number);
            if ([sh, sm, eh, em].some(n => Number.isNaN(n))) return 0;
            const startTotal = sh * 60 + sm;
            let endTotal = eh * 60 + em;
            if (endTotal < startTotal) {
                endTotal += 24 * 60; // กรณีข้ามเที่ยงคืน
            }
            return Math.max(0, endTotal - startTotal);
        }

        function formatMinutesToThaiDuration(mins) {
            const total = Math.max(0, Number(mins) || 0);
            const h = Math.floor(total / 60);
            const m = total % 60;
            if (h > 0 && m > 0) return `${h} ชั่วโมง ${m} นาที`;
            if (h > 0) return `${h} ชั่วโมง`;
            return `${m} นาที`;
        }

            { day: 4, week: 1, title: 'เดิน', timeHint: 'เช้า 5 น. • เย็น 5 น. (เดิน 3 น. + นั่ง 2 น.) • ระหว่างวัน 3 ครั้ง', intent: 'เดินโดยรู้กายและดูทางควบคู่กัน ความมั่นคงสำคัญกว่าความช้า ผู้ที่เดินไม่สะดวกอาจรู้การเคลื่อนมือขณะนั่งแทน', steps: ['เลือกทางเรียบและว่าง ยืนรู้สัมผัสเท้า ลืมตาให้เห็นทางและสิ่งรอบตัว', 'ช่วงเย็นแบ่งเป็นเดินประมาณ 3 นาทีและนั่ง 2 นาที รู้ก้าวและเท้าสัมผัสพื้นตามที่ชัด', 'ถึงปลายทางให้หยุดก่อนกลับตัว หากโคลงเคลงให้หยุดและปรับวิธี ไม่เพ่งเท้าจนละเลยทาง'], reviewQ: 'ช่วงใดรู้ก้าวหรือสัมผัสชัด ช่วงใดคิดถึงจุดหมาย และกลับมาได้อย่างไร', example: 'รู้ฝ่าเท้าขวาสัมผัสพื้นสองสามก้าว แล้วคิดถึงเวลา เมื่อรู้ตัวจึงรู้การยืนก่อนกลับตัว' },
            { day: 5, week: 1, title: 'กิน', timeHint: 'เช้า 5 น. • เย็น 5 น. • รู้ตัวในสามคำแรกของมื้ออาหาร', intent: 'มื้ออาหารเป็นกิจวัตรที่มีทั้งการเคลื่อนไหว รส เวทนา และความอยาก การฝึกสั้นในสามคำแรกช่วยให้เรียนรู้โดยยังรับประทานอาหารตามปกติ', steps: ['ก่อนเริ่มมื้อ รู้ท่านั่งและความตั้งใจจะตักอาหาร เลือกขนาดคำที่กลืนได้ปลอดภัย', 'รู้การยกอาหาร การเคี้ยว และการกลืนเท่าที่ชัด สังเกตรสโดยไม่ต้องบรรยายรสทุกอย่าง', 'เมื่อพอใจหรืออยากรีบตักคำต่อไป ให้รู้ความอยากแล้วกินต่อ ไม่กลั้นกลืนเพื่อรอการกำหนด'], reviewQ: 'รสที่ลิ้นกับความคิดว่าอร่อยเป็นส่วนเดียวกันทั้งหมดหรือไม่ สังเกตได้เพียงใด', example: 'รู้รสหวานช่วงสั้น ๆ แล้วอยากตักเพิ่ม พอวางช้อนจึงรู้สัมผัสมือกับโต๊ะ' },
            { day: 6, week: 1, title: 'งานบ้าน', timeHint: 'เช้า 5 น. • เย็น 5 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'เลือกงานที่ไม่เสี่ยงหนึ่งอย่าง เช่น ล้างแก้วที่ไม่แตกง่ายหรือพับผ้า ใช้งานเป็นที่ระลึกรู้และทำหน้าที่ให้เสร็จ', steps: ['กำหนดช่วงประมาณ 1 นาที รับรู้ท่ายืนหรือนั่งและการเอื้อมมือก่อนเริ่มงาน', 'รู้การจับ การเคลื่อนไหว และสัมผัสน้ำหรือผ้า เมื่อคิดเรื่องอื่นให้กลับมาที่งาน', 'จบงานแล้วทบทวนหนึ่งเหตุการณ์ หากงานเกี่ยวกับของมีคมหรือความร้อน ให้ใส่ใจความปลอดภัยของงานก่อน'], reviewQ: 'การรู้ตัวช่วยให้เห็นการรีบหรือเกร็งตรงไหน และปรับงานให้พอดีได้อย่างไร', example: 'ขณะพับผ้ารู้มือดึงผ้า ต่อมาคิดเรื่องโทรศัพท์ เมื่อรู้ว่าเผลอจึงกลับมารู้สัมผัสผ้า' },
            { day: 7, week: 1, title: 'ทบทวนกาย', timeHint: 'เช้า 5 น. • เย็น 5 น. • พบครู/ทบทวนประจำสัปดาห์ที่ 1', intent: 'วันทบทวนใช้ข้อมูลจากหกวันที่ผ่านมา เพื่อเลือกวิธีที่เหมาะกับตน ไม่ต้องชดเชยวันที่ขาดด้วยการฝึกนานเป็นพิเศษ', steps: ['อ่านบันทึกและเลือกครั้งที่รู้กายชัดหนึ่งครั้งกับครั้งที่เผลอหนึ่งครั้ง', 'เขียนอาการที่รู้จริง ท่าที่ใช้ และเงื่อนไข เช่น ความเหนื่อยหรือสิ่งรบกวน โดยไม่ตัดสินคุณค่าตน', 'พบครูหรือสนทนาตามช่องทางที่ตกลง ถามเรื่องท่า อารมณ์หลัก และการกลับมาเมื่อเผลอ'], reviewQ: 'ฉันแยกอาการกายที่สัมผัสได้จริงออกจากเรื่องราวที่คิดเกี่ยวกับกายได้บ้างหรือไม่', example: 'รู้สัมผัสเท้าชัดเมื่อนั่งพัก แต่ตอนรีบออกจากบ้านลืมฝึก จึงเลือกก่อนอาหารเป็นจุดเริ่มใหม่' },

            // สัปดาห์ที่ 2: รู้เวทนาและสภาพจิต (เช้า 7 นาที เย็น 8 นาที ระหว่างวัน 3 ครั้ง ครั้งละประมาณ 1 นาที)
            { day: 8, week: 2, title: 'สุข ทุกข์ และเฉย', timeHint: 'เช้า 7 น. • เย็น 8 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'เวทนาหมายถึงลักษณะสุข ทุกข์ หรือไม่สุขไม่ทุกข์ของประสบการณ์ คำว่าเฉยในกิจกรรมนี้ไม่จำเป็นต้องหมายถึงจิตสงบหรือปัญญา', steps: ['เลือกกิจวัตรธรรมดา เช่น นั่งพักหรือดื่มน้ำ รู้กายก่อนหนึ่งขณะ', 'สังเกตว่าประสบการณ์ขณะนั้นสบาย ไม่สบาย หรือไม่เด่นทั้งสองด้าน ไม่ต้องค้นให้ครบสามชนิด', 'รู้เท่าที่ชัดแล้วทำกิจวัตรต่อ ช่วงเย็นทบทวนว่ามีความอยากให้เวทนาคงอยู่หรือหายไปหรือไม่'], reviewQ: 'สิ่งที่เรียกว่าเฉยเป็นเวทนาที่ไม่เด่น หรือเป็นเพราะยังสังเกตไม่ชัด แยกได้เพียงใด', example: 'ตอนดื่มน้ำรู้สึกสบาย ต่อมานั่งทำงานไม่รู้สึกเด่น จึงบันทึกว่ายังแยกไม่ชัด' },
            { day: 9, week: 2, title: 'ไม่สบายกาย', timeHint: 'เช้า 7 น. • เย็น 8 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'ฝึกกับความไม่สบายเล็กน้อยที่มีอยู่ตามธรรมชาติ โดยยังดูแลร่างกายตามจำเป็น ไม่ใช้การทนเจ็บเป็นเครื่องวัดความก้าวหน้า', steps: ['รู้ตำแหน่งและลักษณะ เช่น ตึง อุ่น หรือกด เท่าที่สังเกตได้โดยไม่จ้องจนเครียด', 'เมื่อจำเป็นต้องขยับ ให้รู้ความตั้งใจแล้วปรับท่าอย่างนุ่มนวล ไม่รอให้ปวดมาก', 'หลังขยับสังเกตว่าความไม่สบายเปลี่ยนหรือไม่ หากอาการใหม่ รุนแรง หรือคงอยู่ ให้รับการดูแลที่เหมาะสม'], reviewQ: 'ความไม่สบายที่กายกับความคิดว่าทนไม่ได้ปรากฏต่างกันอย่างไร และฉันดูแลกายอย่างไร', example: 'รู้ตึงไหล่และคิดว่าเมื่อไรจะจบ จึงปรับท่า ความตึงลดลงบางส่วน แต่ยังมีอยู่' },
            { day: 10, week: 2, title: 'พอใจ', timeHint: 'เช้า 7 น. • เย็น 8 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'ความสุขเป็นสิ่งที่รู้ได้เช่นเดียวกับความทุกข์ เมื่อได้รับคำชม อาหารที่ชอบ หรือความช่วยเหลือ ให้รู้ความพอใจโดยไม่ต้องปฏิเสธความสุข', steps: ['เมื่อเกิดความพอใจตามธรรมชาติ รู้กายที่เกี่ยวข้อง เช่น สีหน้าหรือความผ่อนคลาย', 'รู้เวทนาที่สบายและสังเกตความอยากให้ความรู้สึกนี้อยู่ต่อ โดยไม่รีบสรุปว่าความอยากเป็นตัวตน', 'กลับมาทำสิ่งที่อยู่ตรงหน้า แล้วทบทวนภายหลังว่าความเข้มของความพอใจเปลี่ยนอย่างไร'], reviewQ: 'ความสุขกับการพยายามรักษาความสุขปรากฏเหมือนหรือต่างกันอย่างไร', example: 'ยิ้มเมื่อได้รับคำชม ต่อมาเปิดอ่านข้อความชมซ้ำ รู้ว่าอยากได้ความพอใจเดิมอีก' },
            { day: 11, week: 2, title: 'คิดและเผลอ', timeHint: 'เช้า 7 น. • เย็น 8 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'การรู้ว่าเผลอคือขณะที่เริ่มกลับมารู้ตัวได้ ไม่จำเป็นต้องกำจัดความคิดทั้งหมดเพื่อให้การฝึกมีคุณค่า', steps: ['นั่งรู้อารมณ์หลักตามวิธีเดิม เมื่อรู้ว่าเรื่องราวในใจพาไป ให้รู้สั้น ๆ ว่าคิด', 'ไม่ตามตรวจว่าเรื่องเริ่มตรงไหนทุกครั้ง ค่อยกลับสู่พองยุบหรือสัมผัสที่ชัด', 'หากมีงานจำเป็นต้องจำ ให้จดหลังจบช่วงฝึก แยกเวลาคิดแก้ปัญหาออกจากเวลารู้สภาวะ'], reviewQ: 'หลังเผลอมีคำตำหนิตนตามมาหรือไม่ ถ้ามีฉันรู้และเริ่มใหม่อย่างไร', example: 'เผลอวางแผนงานแล้วรู้ว่าคิด มีความหงุดหงิดตามมา จึงรู้ความตึงและกลับมารู้มือ' },
            { day: 12, week: 2, title: 'จิตมีโทสะ', timeHint: 'เช้า 7 น. • เย็น 8 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'เลือกเหตุการณ์ขัดใจเล็กน้อยที่เกิดขึ้นเอง การรับรู้โทสะช่วยให้มีข้อมูลก่อนตัดสินใจพูด โดยยังต้องแก้ปัญหาที่เป็นข้อเท็จจริง', steps: ['หยุดการตอบโต้ชั่วคราวเมื่อทำได้อย่างปลอดภัย รู้สัมผัสเท้าหรือมือ', 'รู้ความตึง ความไม่สบายใจ และจิตขุ่นเคืองทีละสิ่งที่เด่น ไม่บังคับให้คลายทันที', 'เลือกขอเวลา ตรวจสอบข้อมูล หรือพูดความต้องการอย่างสุภาพ แล้วทบทวนผลหลังเหตุการณ์'], reviewQ: 'ช่วงที่รู้โทสะทำให้การกระทำเปลี่ยนไปหรือไม่ หากยังเปลี่ยนไม่ได้ต้องการความช่วยเหลือใด', example: 'อยากพูดสวนเมื่อถูกขัด รู้กรามเกร็ง จึงบอกว่าขอฟังรายละเอียดก่อน แม้ใจยังขุ่นอยู่' },
            { day: 13, week: 2, title: 'จิตง่วงหรือฟุ้ง', timeHint: 'เช้า 7 น. • เย็น 8 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'ความง่วงและฟุ้งซ่านควรได้รับการรู้และดูเงื่อนไข ความอ่อนล้าจากการพักผ่อนไม่พอไม่ควรถูกแก้ด้วยการฝืนเพิ่มเวลาฝึก', steps: ['รู้สภาพที่ปรากฏ เช่น หนังตาหนักหรือคิดเปลี่ยนเรื่องเร็ว โดยไม่รีบติดป้ายว่าฝึกไม่ดี', 'ตรวจท่า เวลาฝึก และการนอน อาจลืมตา เปลี่ยนเป็นเดินที่ปลอดภัย หรือลดช่วงฝึก', 'หากเหนื่อยจริงให้พัก แล้วบันทึกผลของการปรับอย่างตรงไปตรงมา'], reviewQ: 'การปรับแบบใดทำให้รู้ตัวได้พอดี และแบบใดเพิ่มความเกร็ง', example: 'นอนน้อยแล้วง่วงระหว่างนั่ง จึงหยุดพัก ช่วงเย็นฝึกสั้นลงและเข้านอนตามเวลา' },
            { day: 14, week: 2, title: 'ทบทวนเวทนาและจิต', timeHint: 'เช้า 7 น. • เย็น 8 น. • แบบสะท้อนกึ่งกลางโปรแกรม', intent: 'ใช้เหตุการณ์เดียวแยกความรู้สึกสุขทุกข์ สภาพจิต และการกระทำ เพื่อให้รายงานประสบการณ์ชัดขึ้น พร้อมทบทวนกึ่งกลางโปรแกรม', steps: ['เลือกเหตุการณ์ธรรมดาจากบันทึก เขียนอาการกาย เวทนา สภาพจิต และสิ่งที่ทำตามจริง', 'ทำแบบสะท้อนการเรียนรู้วันที่ 14 และบันทึกการนอนหรือความไม่สบายร่วมด้วย', 'นำคำถามไปพบครู ปรับเวลาหรือวิธีตามข้อมูล ไม่เปรียบเทียบคะแนนกับคนอื่น'], reviewQ: 'ฉันรู้ว่าไม่สบายกับคิดว่าทนไม่ได้เป็นคนละส่วนของประสบการณ์ได้บ้างหรือไม่', example: 'ได้ยินเสียงดังแล้วสะดุ้ง มีความไม่สบายใจและหงุดหงิด จึงย้ายไปทำงานในที่สงบกว่า' },

            // สัปดาห์ที่ 3: รู้การรับรู้และเหตุปัจจัย (เช้า 10 นาที เย็น 10 นาที ระหว่างวัน 3 ครั้ง ครั้งละประมาณ 1 นาที)
            { day: 15, week: 3, title: 'การเห็น', timeHint: 'เช้า 10 น. • เย็น 10 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'การเห็นข้อความเป็นจุดเริ่มศึกษาการรับรู้และการตอบสนอง ใช้เพียงบางส่วนของอายตนะและเหตุปัจจัย', steps: ['ก่อนเปิดข้อความหนึ่งครั้ง รู้ความตั้งใจและการเอื้อมมือไปหาโทรศัพท์', 'อ่านให้เข้าใจตามงานจริง สังเกตเวทนาหรือความอยากตอบที่เด่นหลังอ่าน', 'ทบทวนภายหลังว่าอะไรคือข้อความที่เห็น อะไรคือข้อสันนิษฐาน และต้องตรวจสอบอะไรเพิ่ม'], reviewQ: 'มีส่วนใดที่ฉันถือว่าความคิดของตนเป็นเจตนาของผู้ส่งโดยยังไม่ได้สอบถาม', example: 'เห็นคำว่าคุยหน่อยแล้วคิดว่าถูกตำหนิ รู้กังวล จึงถามว่าต้องเตรียมเรื่องใดไปคุย' },
            { day: 16, week: 3, title: 'การได้ยิน', timeHint: 'เช้า 10 น. • เย็น 10 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'เสียงที่กระทบหูกับความหมายที่คิดตามเป็นสิ่งที่ทบทวนแยกกันได้ การรู้ตัวไม่ทำให้ต้องเลิกเข้าใจภาษา แต่ช่วยให้ตรวจสอบการตีความ', steps: ['เลือกการฟังที่ไม่เสี่ยง เช่น ฟังเพื่อนเล่าเรื่องสั้น ๆ รู้เสียงที่เด่นโดยยังฟังเนื้อหา', 'สังเกตความรู้สึกและความอยากแทรกที่เกิดตามมา ฟังให้จบก่อนตรวจความเข้าใจ', 'หลังสนทนาเขียนสิ่งที่ได้ยินจริงกับความคิดที่เติมลงไป หากไม่แน่ใจให้ระบุว่าไม่แน่ใจ'], reviewQ: 'น้ำเสียงหรือคำพูดส่วนใดได้ยินจริง และส่วนใดเป็นข้อสรุปว่าเขาไม่พอใจ', example: 'ได้ยินเพื่อนพูดสั้น ๆ แล้วคิดว่าโกรธ เมื่อถามจึงทราบว่ากำลังรีบไปประชุม' },
            { day: 17, week: 3, title: 'การสัมผัส', timeHint: 'เช้า 10 น. • เย็น 10 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'รู้ร้อน เย็น แข็ง อ่อน หรือความตึงที่ปรากฏจากการสัมผัสตามปกติ ไม่สร้างความเจ็บหรือใช้สิ่งร้อนเย็นจัดเพื่อทดลองธรรมะ', steps: ['เลือกจุดสัมผัสที่ปลอดภัย เช่น มือจับแก้วน้ำอุณหภูมิปกติหรือเท้าสัมผัสพื้น', 'รู้ลักษณะที่ชัดทีละขณะ ไม่ต้องตั้งชื่อให้ครบทุกธาตุหรือทุกคุณสมบัติ', 'วางสิ่งของหรือเปลี่ยนท่าตามจำเป็น สังเกตว่าสัมผัสและความรู้สึกที่ตามมาเปลี่ยนหรือไม่'], reviewQ: 'ฉันรู้ความแข็งหรืออุณหภูมิโดยตรง หรือกำลังคิดภาพของวัตถุเป็นหลัก', example: 'มือรู้ความเย็นที่ผิวแก้ว หลังวางแก้วยังรู้เย็นที่นิ้ว แล้วความรู้สึกนั้นค่อยเบาลง' },
            { day: 18, week: 3, title: 'นิวรณ์', timeHint: 'เช้า 10 น. • เย็น 10 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'เรียนรู้สิ่งที่กีดขวางความพร้อมของจิตตามที่พบจริง ได้แก่ ความเพลิดเพลินติดใจ พยาบาท ถีนมิทธะ อุทธัจจกุกกุจจะ หรือวิจิกิจฉา', steps: ['เลือกเพียงสภาพที่เด่น ไม่ต้องค้นให้ครบห้าข้อ เช่น อยากเปิดโทรศัพท์หรือคิดวนเรื่องงาน', 'หลังรู้สภาพนั้น ทบทวนเงื่อนไขที่สัมพันธ์กัน เช่น การพักผ่อน สิ่งรบกวน หรือเรื่องค้างใจ', 'ปรับเงื่อนไขหนึ่งอย่างที่ทำได้ แล้วสังเกตผล โดยไม่สรุปว่าเหตุเดียวอธิบายได้ทั้งหมด'], reviewQ: 'สิ่งกีดขวางใดพบจริง และมีข้อมูลใดรองรับข้อสันนิษฐานเรื่องเหตุของมัน', example: 'เห็นโทรศัพท์แล้วอยากเปิดบ่อย จึงวางห่างช่วงฝึก ยังคิดถึงบ้างแต่หยิบขึ้นมาน้อยลง' },
            { day: 19, week: 3, title: 'ผัสสะและเวทนา', timeHint: 'เช้า 10 น. • เย็น 10 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'ใช้เหตุการณ์จริงเพื่อมองความสัมพันธ์ระหว่างสิ่งกระทบ ความรู้สึก และความอยาก การบันทึกเป็นการทบทวน ไม่ควรเติมขั้นตอนที่ไม่ได้สังเกต', steps: ['เลือกเหตุการณ์หนึ่ง เช่น อ่านข่าวหรือฟังคำพูด ระบุสิ่งที่เห็นหรือได้ยินให้ชัด', 'เขียนเวทนาที่รู้ได้และความอยากที่สังเกต หากส่วนใดไม่ชัดให้เว้นไว้หรือเขียนว่าไม่ทราบ', 'พิจารณาว่ามีทางเลือกใดก่อนลงมือ เช่น พัก ตรวจสอบ หรือขอความช่วยเหลือ แล้วลองเมื่อเหมาะสม'], reviewQ: 'เมื่อเห็นความอยาก มีช่วงเลือกการกระทำเพิ่มขึ้นบ้างหรือไม่', example: 'อ่านข่าวแล้วไม่สบายใจ อยากส่งต่อทันที จึงตรวจแหล่งข่าวก่อนและยังไม่ส่งต่อ' },
            { day: 20, week: 3, title: 'ความเปลี่ยนแปลง', timeHint: 'เช้า 10 น. • เย็น 10 น. • ระหว่างวัน 3 ครั้ง (ครั้งละ ~1 น.)', intent: 'สังเกตอาการหนึ่งโดยไม่พยายามทำให้เปลี่ยนเพื่อให้ตรงกับคำสอน ความไม่ชัดก็เป็นข้อมูลที่รายงานได้', steps: ['เลือกสัมผัสหรือเวทนาที่ไม่รุนแรง รู้ช่วงสั้นตามกำลัง', 'รู้ซ้ำเมื่ออาการนั้นปรากฏ สังเกตตำแหน่ง ความเข้ม หรือการสลับกับอารมณ์อื่น', 'หลังฝึกบันทึกสิ่งที่พบจริง แยกจากข้อคิดเรื่องอนิจจังที่อ่านหรือจำมา'], reviewQ: 'อะไรคือหลักฐานที่ฉันใช้บอกว่าเปลี่ยน และมีส่วนใดที่ยังไม่แน่ใจ', example: 'ความตึงที่มือชัดแล้วเบาลง แต่ไม่ทราบว่าดับเมื่อใด จึงไม่เติมคำอธิบายส่วนที่ไม่รู้' },
            { day: 21, week: 3, title: 'ทบทวนเหตุปัจจัย', timeHint: 'เช้า 10 น. • เย็น 10 น. • พบครูทบทวนสัปดาห์ที่ 3', intent: 'นำตัวอย่างหนึ่งเหตุการณ์ไปสนทนากับครู เพื่อแยกการสังเกตกับการสรุปเหตุ ความสัมพันธ์ที่พบครั้งเดียวอาจยังไม่พอให้ตัดสินทั่วไป', steps: ['เลือกบันทึกที่มีสิ่งกระทบ เวทนา และการกระทำค่อนข้างชัด', 'ทำเครื่องหมายข้อความที่รู้ตรงและข้อความที่เป็นข้อสันนิษฐาน แล้วเขียนคำถามหนึ่งข้อ', 'พบครูเพื่อทบทวนความเข้าใจและปรับงานฝึก โดยรักษาอารมณ์หลักเดิมที่เหมาะกับตน'], reviewQ: 'ฉันเห็นเงื่อนไขที่ทำให้ความขัดใจเพิ่มหรือลด โดยไม่โทษตนหรือผู้อื่นทั้งหมดได้หรือไม่', example: 'เมื่ออดนอนมักหงุดหงิด แต่ยังมีเรื่องงานร่วมด้วย จึงตั้งข้อสังเกตแทนสรุปว่าเกิดจากการนอนเท่านั้น' },

            // สัปดาห์ที่ 4: ใช้ปัญญาในการดำเนินชีวิต (เช้า 10 นาที เย็น 10 นาที ระหว่างวัน 3 ครั้ง ครั้งละประมาณ 1 นาที)

        window.addClassPracticeEntry = function(event) {
            event.preventDefault();
            const dateVal = document.getElementById('cls-prac-date')?.value || getTodayISO();
            const titleVal = (document.getElementById('cls-prac-title')?.value || '').trim() || 'ปฏิบัติธรรมในชั้นเรียน';
            const hrsVal = Math.max(0, Number(document.getElementById('cls-prac-hours')?.value || 0));
            const minsVal = Math.max(0, Math.min(59, Number(document.getElementById('cls-prac-minutes')?.value || 0)));
            const noteVal = (document.getElementById('cls-prac-note')?.value || '').trim();

            if (hrsVal === 0 && minsVal === 0) {
                showToast('กรุณาระบุจำนวนชั่วโมงหรือนาทีปฏิบัติธรรมในชั้นเรียน', 'error');
                return;
            }
            classPracticeEntries.unshift({
                id: `CLS-${Date.now()}`,
                date: dateVal,
                sessionTitle: titleVal,
                hours: hrsVal,
                minutes: minsVal,
                note: noteVal
            });
            persistPractice();
            showToast('บันทึกชั่วโมงปฏิบัติธรรมในชั้นเรียนเรียบร้อยแล้ว');
            renderApp();
        };

            persistPractice();
            showToast('ลบรายการปฏิบัติธรรมในชั้นเรียนแล้ว', 'info');
            renderApp();

            return `
            <div class="space-y-5 text-xs">

                    <div class="border-b border-cream-200 pb-3">

                        <p class="text-gray-500">ตามเกณฑ์หลักสูตรประกาศนียบัตรการปรึกษาเชิงจิตวิทยาแนววิปัสสนาภาวนา (ป.จว.)</p>

                        <div class="p-4 rounded-2xl bg-teal-50/80 border border-teal-200 space-y-1.5">
                            <div class="font-bold text-sm text-teal-900">ส่วนที่ 1 : การปฏิบัติธรรมในชั้นเรียนและวันวิปัสสนาธุระ</div>
                            <p class="text-gray-700 leading-relaxed">ชั่วโมงฝึกปฏิบัติภาวนาในคาบเรียนภาคปฏิบัติ (จว 002 / จว 004) และวันปฏิบัติธรรมวิปัสสนาธุระของหลักสูตร (30 ธ.ค. 2569 – 1 ม.ค. 2570) นับรวมเป็นชั่วโมงปฏิบัติธรรมสะสมได้</p>

                            <h3 class="text-lg font-bold text-earth-800">รายการปฏิบัติธรรมในชั้นเรียนและกิจกรรมวิปัสสนาธุระ</h3>
                            <p class="text-gray-500">บันทึกชั่วโมงฝึกปฏิบัติในคาบเรียนหรือวันปฏิบัติธรรมร่วมกับคณาจารย์ (นำยอดรวมไปคำนวณในช่องด้านบนได้ทันที)</p>

                        <div class="px-4 py-2 rounded-xl bg-teal-50 border border-teal-200 text-right shrink-0">

                            <div class="text-sm font-bold text-teal-900">${formatMinutesToThaiDuration(totalClassMins)} (${totalClassEquivDays} วัน)</div>
                        </div>
                    </div>

                    <form onsubmit="addClassPracticeEntry(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3 p-4 rounded-2xl bg-teal-50/50 border border-teal-200 items-end">
                        <div class="sm:col-span-3">
                            <label class="block font-semibold text-gray-700 mb-1">วันที่ปฏิบัติธรรม</label>
                            <input id="cls-prac-date" type="date" value="2026-12-30" required class="w-full px-3 py-2 rounded-xl border border-cream-200 bg-white">
                        </div>
                        <div class="sm:col-span-4">
                            <label class="block font-semibold text-gray-700 mb-1">คาบเรียน / กิจกรรมปฏิบัติธรรม</label>
                            <select id="cls-prac-title" class="w-full px-3 py-2 rounded-xl border border-cream-200 bg-white">
                                <option value="วันปฏิบัติธรรม วิปัสสนาธุระ (30 ธ.ค. 2569 - 1 ม.ค. 2570)">วันปฏิบัติธรรม วิปัสสนาธุระ (30 ธ.ค. 2569 – 1 ม.ค. 2570)</option>
                                ${classPracticeSessions.map(s => `<option value="${escapeHTML(s.title)}">${formatThaiDate(s.date)} • ${escapeHTML(s.title)}</option>`).join('')}
                                <option value="ฝึกปฏิบัติวิปัสสนาภาวนาในชั้นเรียน (Onsite / Zoom)">ฝึกปฏิบัติวิปัสสนาภาวนาในชั้นเรียน (Onsite / Zoom)</option>
                            </select>

                        </div>
                    </form>

                    <div class="space-y-2">
                        ${classPracticeEntries.length === 0 ? `<div class="text-center text-gray-500 py-3">ยังไม่มีรายการบันทึกปฏิบัติธรรมในชั้นเรียน</div>` : classPracticeEntries.map(item => `
                            <div class="p-3 rounded-xl border border-cream-200 bg-cream-50/60 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <div>
                                    <div class="flex flex-wrap items-center gap-2">

                                    </div>
                                    <div class="font-bold text-earth-800 mt-0.5">${escapeHTML(item.sessionTitle)}</div>
                                    ${item.note ? `<div class="text-gray-600">บันทึก: ${escapeHTML(item.note)}</div>` : ''}
                                </div>
                                <button type="button" onclick="removeClassPracticeEntry('${escapeHTML(item.id)}')" class="px-3 py-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-red-700 font-semibold self-start sm:self-center shrink-0">

            `;
        }

        // =========================================================================
        // 10. งานสอนของอาจารย์ (เช็กชื่อ การบ้าน ตรวจบันทึก ให้คะแนน) และการบ้านของนักศึกษา
        // =========================================================================
        const SUBJECTS = [
            { code: 'จว 001', name: 'จิตวิทยาในพระไตรปิฎก' },
            { code: 'จว 002', name: 'การพัฒนาจิตวิทยาสู่วิปัสสนาภาวนา' },
            { code: 'จว 003', name: 'แนวคิดและทฤษฎีพุทธจิตวิทยาและจิตวิทยาการให้การปรึกษา' },
            { code: 'จว 004', name: 'ทักษะและกระบวนการให้การปรึกษาเชิงจิตวิทยาแนววิปัสสนาภาวนา' }
        ];
        const ATT_STATUSES = [
            { v: 'มา', on: 'bg-emerald-600 text-white border-emerald-700', off: 'bg-emerald-50 text-emerald-900 border-emerald-200 hover:bg-emerald-100' },
            { v: 'สาย', on: 'bg-amber-500 text-white border-amber-600', off: 'bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100' },
            { v: 'ลา', on: 'bg-sky-600 text-white border-sky-700', off: 'bg-sky-50 text-sky-900 border-sky-200 hover:bg-sky-100' },
            { v: 'ขาด', on: 'bg-red-600 text-white border-red-700', off: 'bg-red-50 text-red-900 border-red-200 hover:bg-red-100' }
        ];
        let teachSubTab = 'attendance';
        let teachSessionId = '';
        let teachSubject = 'จว 001';
        let teachAssignmentId = '';
        let teachStudentId = '';
        let teachLogFilter = 'pending';
        let teachLogStudent = '';

        function canGrade() { return ['teacher', 'admin'].includes(currentSession?.role); }
        function canViewTeaching() { return ['teacher', 'admin', 'ta'].includes(currentSession?.role); }
        // ----- การบ้านผูกกับตารางสอน -----
        function sessionsOfSubject(subj) {
            return (appData.sessions || []).filter(s => subjectOfSession(s) === subj)
                .sort((a, b) => String(a.date).localeCompare(String(b.date)));
        }
        function defaultAsgSessionId(subj) {
            const list = sessionsOfSubject(subj);
            const today = getTodayISO();
            const past = list.filter(s => s.date <= today);
            return (past[past.length - 1] || list[0] || {}).id || '';
        }
        function nextSessionDateAfter(subj, date) {
            const n = sessionsOfSubject(subj).find(s => s.date > date);
            return n ? n.date : '';
        }
        function sortAssignments(list) {
            return list.slice().sort((a, b) => String(a.assignedDate || a.createdAt || '').localeCompare(String(b.assignedDate || b.createdAt || '')));
        }
        function assignedLabel(a) {
            if (!a.assignedDate) return '';
            const ses = (appData.sessions || []).find(s => s.id === a.sessionId);
            const m = ses ? toArabicDigits(ses.title || '').match(/ครั้งที่\s*(\d+)/) : null;
            return `สั่งเมื่อ ${formatThaiDate(a.assignedDate)}${m ? ` (คาบครั้งที่ ${m[1]})` : ''}`;
        }
        function studentPendingHomework(uid) {
            const subs = appData.submissions || {};
            return (appData.assignments || []).filter(a => { const s = subs[subKey(a.id, uid)]; return !(s && (s.text || s.link)); });
        }
        window.onAsgSessionChange = function(sel) {
            const ses = (appData.sessions || []).find(s => s.id === sel.value);
            const due = document.getElementById('asg-due');
            if (ses && due) due.value = nextSessionDateAfter(teachSubject, ses.date) || '';
        };
        window.goTab = function(id) {
            currentTab = id;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            refreshFromServer(true);
        };
        function subjectOfSession(ses) {
            const t = toArabicDigits(ses?.title || '');
            const s = SUBJECTS.find(x => t.includes(x.code));
            return s ? s.code : '';
        }
        function subjectName(code) { return (SUBJECTS.find(s => s.code === code) || {}).name || code; }
        function attRecord(sid, sesId) { return (appData.attendance || {})[`${sid}_${sesId}`] || {}; }
        function isPresentRec(rec) {
            if (rec.teacherStatus) return rec.teacherStatus === 'มา' || rec.teacherStatus === 'สาย';
            return Boolean(rec.checkInTime);
        }
        function subKey(aid, sid) { return `${aid}_${sid}`; }
        function reviewKey(sid, subj, kind) { return `${sid}_${subj}_${kind}`; }

        // ----- สถานะ "อาจารย์ตรวจแล้ว" ของบันทึกปฏิบัติธรรมรายรายการ (เก็บในแท็บ LMS คะแนนอาจารย์) -----
        // type: 'd' = บันทึกการปฏิบัติในชีวิตประจำวัน (id ของรายการ), 'j' = บันทึกการเรียนรู้โปรแกรม 28 วัน (เลขวัน)
        function practiceCheckKey(sid, type, id) { return `${sid}_chk_${type}_${id}`; }
        function getPracticeCheck(sid, type, id) { return (appData.reviews || {})[practiceCheckKey(sid, type, id)] || null; }
        function journalHasContent(x) { return Boolean(x && (x.truth || x.action || x.discomfort)); }
        function journalUpdatedAt(sid, day) { const st = (appData.practiceByUser || {})[sid] || {}; return ((st.journal || {})[day] || {}).updatedAt || ''; }
        function journalNeedsCheck(sid, day, x) {
            if (!journalHasContent(x)) return false;
            const c = getPracticeCheck(sid, 'j', day);
            if (!c) return true;
            if (!x.updatedAt) return false;
            return c.seenUpdatedAt ? x.updatedAt !== c.seenUpdatedAt : Boolean(c.at && x.updatedAt > c.at);
        }
        function practicePendingItems(sid) {
            const st = (appData.practiceByUser || {})[sid] || {};
            const d30 = Array.isArray(st.daily30) ? st.daily30 : [];
            const journal = st.journal || {};
            const items = [];
            let latest = '';
            d30.forEach(e => {
                if (e && e.id != null && !getPracticeCheck(sid, 'd', e.id)) items.push({ type: 'd', id: String(e.id) });
                if (e && (e.date || '') > latest) latest = e.date;
            });
            Object.keys(journal).forEach(d => {
                const x = journal[d];
                if (journalNeedsCheck(sid, d, x)) items.push({ type: 'j', id: String(d) });
                const u = String((x && x.updatedAt) || '').slice(0, 10);
                if (u > latest) latest = u;
            });
            return { items, latest };
        }
        function practiceCheckBadge(chk, edited) {
            if (!chk) return '';
            return `<div class="mt-1.5 p-2 rounded-lg ${edited ? 'bg-amber-50 border border-amber-200 text-amber-900' : 'bg-emerald-50 border border-emerald-200 text-emerald-900'}">
                <b>${edited ? '✎ แก้ไขหลังอาจารย์ตรวจ' : '✓ อาจารย์ตรวจแล้ว'}</b> • ${escapeHTML(chk.by || '')}${chk.at ? ` • ${formatThaiDate(String(chk.at).slice(0, 10))}` : ''}

        function numVal(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
        function hasScore(v) { return v !== '' && v !== null && v !== undefined; }
        function defaultTeachSession() {
            const sessions = appData.sessions || [];
            const today = getTodayISO();
            const upcoming = sessions.filter(s => s.date <= today);
            return (upcoming[upcoming.length - 1] || sessions[0] || {}).id || '';
        }

        function subjectSummary(sid, subj) {
            const sessions = (appData.sessions || []).filter(s => subjectOfSession(s) === subj);
            const present = sessions.filter(s => isPresentRec(attRecord(sid, s.id))).length;
            const asg = (appData.assignments || []).filter(a => a.subject === subj);
            let hwScore = 0, hwMax = 0, hwSubmitted = 0;
            asg.forEach(a => {
                hwMax += numVal(a.maxScore);
                const sub = (appData.submissions || {})[subKey(a.id, sid)];
                if (sub && (sub.text || sub.link)) hwSubmitted++;
                if (sub && hasScore(sub.score)) hwScore += numVal(sub.score);
            });
            const practice = (appData.reviews || {})[reviewKey(sid, subj, 'practice')] || null;
            const logs = (appData.logs || []).filter(l => l.studentId === sid && l.subject === subj && hasScore(l.score));
            const cScore = logs.reduce((a, l) => a + numVal(l.score), 0);
            const cMax = logs.reduce((a, l) => a + (numVal(l.maxScore) || 10), 0);
            const pScore = practice && hasScore(practice.score) ? numVal(practice.score) : 0;
            const pMax = practice ? (numVal(practice.maxScore) || 0) : 0;
            return {
                sessions: sessions.length, present, attPct: sessions.length ? Math.round(present * 100 / sessions.length) : 0,
                asgCount: asg.length, hwSubmitted, hwScore, hwMax, practice, pScore, pMax, cScore, cMax, cCount: logs.length,
                total: hwScore + pScore + cScore, totalMax: hwMax + pMax + cMax
            };
        }
